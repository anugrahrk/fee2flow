name: Peekaboo iOS Build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Peekaboo build ID'
        required: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Xcode project
        id: find_proj
        run: |
          PROJ=$(find . -name "*.xcodeproj" -not -path "*/node_modules/*" | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | awk '/Schemes:/,0' | sed -n '2p' | xargs)
          echo "proj=$PROJ" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
      - name: Build for Simulator
        run: |
          xcodebuild \
            -project "${{ steps.find_proj.outputs.proj }}" \
            -scheme "${{ steps.find_proj.outputs.scheme }}" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO
      - name: Zip .app
        run: |
          APP=$(find ./build -name "*.app" | head -1)
          zip -r app.zip "$APP"
      - name: Upload to Peekaboo
        run: |
          curl -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -F "build_id=${{ github.event.inputs.build_id }}" \
            -F "file=@app.zip"
