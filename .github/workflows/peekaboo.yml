name: Peekaboo iOS Build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Peekaboo build ID'
        required: true
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./feeflow-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./feeflow-mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli
        working-directory: ./feeflow-mobile

      - name: Expo Prebuild (generates ios/ directory)
        run: npx expo prebuild --platform ios --non-interactive
        working-directory: ./feeflow-mobile

      - name: Boot iOS Simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          devices=data.get('devices',{})
          udid=''
          for runtime,devlist in devices.items():
              if 'iOS' not in runtime:
                  continue
              for d in devlist:
                  if d.get('isAvailable') and 'iPhone' in d.get('name',''):
                      udid=d['udid']
                      print(d['name'])
                      break
              if udid:
                  break
          print(udid)
          " | tail -1)
          echo "Booting simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV

      - name: Build for simulator
        run: |
          npx expo run:ios \
            --configuration Debug \
            --no-bundler \
            --device "$SIM_UDID"
        working-directory: ./feeflow-mobile

      - name: Zip .app artifact
        run: |
          APP=$(find ./ios/build -name "*.app" -not -path "*/\.*" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found after build"
            exit 1
          fi
          echo "Found app at: $APP"
          zip -r app.zip "$APP"
        working-directory: ./feeflow-mobile

      - name: Upload to Peekaboo
        run: |
          curl -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }} \
            -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}" \
            -F "build_id=${{ github.event.inputs.build_id }}" \
            -F "file=@app.zip"
        working-directory: ./feeflow-mobile
