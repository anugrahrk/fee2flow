name: Peekaboo iOS Build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Peekaboo build ID'
        required: true
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./feeflow-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./feeflow-mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli
        working-directory: ./feeflow-mobile

      - name: Expo Prebuild (generates ios/ directory)
        run: CI=1 npx expo prebuild --platform ios --clean
        working-directory: ./feeflow-mobile

      - name: Build for simulator
        run: |
          WORKSPACE=$(find ./ios -name "*.xcworkspace" -not -path "*/Pods/*" | head -1)
          PROJ=$(find ./ios -name "*.xcodeproj" -not -path "*/Pods/*" | head -1)
          APP_NAME=$(basename "$PROJ" .xcodeproj)
          
          # Use explicit scheme or derive from the app's xcodeproj
          SCHEME=""
          if [ -z "$SCHEME" ]; then
            SCHEME="$APP_NAME"
          fi
          if [ -z "$SCHEME" ] && [ -n "$PROJ" ]; then
            SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | awk '/Schemes:/,0' | sed -n '2p' | xargs)
          fi
          
          echo "Building workspace: $WORKSPACE with app scheme: $SCHEME"
          xcodebuild             -workspace "$WORKSPACE"             -scheme "$SCHEME"             -sdk iphonesimulator             -configuration Debug             -derivedDataPath ./build             CODE_SIGNING_ALLOWED=NO
        working-directory: ./feeflow-mobile

      - name: Zip .app artifact
        run: |
          APP=$(find ./build -name "*.app" -not -path "*/.*" | grep -v ".appex" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found. Listing build directory:"
            find ./build -type d | head -30
            exit 1
          fi
          echo "Found app at: $APP"
          zip -r app.zip "$APP"
        working-directory: ./feeflow-mobile

      - name: Upload to Peekaboo
        run: |
          curl -X POST ${{ secrets.PEEKABOO_WEBHOOK_URL }}             -H "x-peekaboo-secret: ${{ secrets.PEEKABOO_SECRET }}"             -F "build_id=${{ github.event.inputs.build_id }}"             -F "file=@app.zip"
        working-directory: ./feeflow-mobile
